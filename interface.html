<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PediFácil - Interface do Cardápio</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Alpine.js (Para interatividade simples na interface) -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-zinc-50" x-data="{ 
    isCartOpen: false, 
    isSearchVisible: false, 
    selectedCategory: 'destaques',
    cartCount: 0,
    searchQuery: '',
    products: [
        { id: 1, name: 'Burger do Gordo', description: 'Pão brioche, blend 180g, muito cheddar e bacon crocante.', price: 34.90, originalPrice: 39.90, image: 'https://picsum.photos/seed/burger1/400/400', category: 'burgers', highlight: 'Mais Pedido' },
        { id: 2, name: 'Combo Casal', description: '2 Burgers + Batata G + Refri 1L.', price: 69.90, image: 'https://picsum.photos/seed/combo/400/400', category: 'combos', highlight: 'Promoção' },
        { id: 3, name: 'Batata Rústica', description: 'Batatas fritas com alecrim e sal grosso.', price: 18.00, image: 'https://picsum.photos/seed/fries/400/400', category: 'acompanhamentos' },
        { id: 4, name: 'Coca-Cola 350ml', description: 'Geladinha.', price: 6.00, image: 'https://picsum.photos/seed/coke/400/400', category: 'bebidas' }
    ],
    categories: [
        { id: 'destaques', name: 'Destaques 🔥' },
        { id: 'burgers', name: 'Burgers 🍔' },
        { id: 'combos', name: 'Combos 🎁' },
        { id: 'acompanhamentos', name: 'Acompanhamentos 🍟' },
        { id: 'bebidas', name: 'Bebidas 🥤' }
    ]
}">

    <div class="flex justify-center min-h-screen">
        <!-- Mobile Container -->
        <div class="w-full max-w-[480px] bg-white relative pb-24 shadow-2xl border-x border-zinc-100 overflow-x-hidden">
            
            <!-- Header Banner -->
            <div class="relative">
                <div class="h-48 bg-cover bg-center" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.2), rgba(0,0,0,0.6)), url('https://picsum.photos/seed/restaurant/800/400')"></div>
                <div class="absolute inset-x-0 -bottom-14 flex flex-col items-center">
                    <div class="w-28 h-28 bg-white rounded-[2.5rem] p-1 shadow-2xl border-4 border-white overflow-hidden">
                        <img src="https://picsum.photos/seed/logo/200/200" alt="Logo" class="w-full h-full object-cover rounded-[2.2rem]">
                    </div>
                </div>
            </div>

            <!-- Store Info -->
            <div class="px-6 pt-16 pb-8 text-center">
                <h1 class="text-3xl font-black text-zinc-900 mb-2 tracking-tighter">Burger do Gordo</h1>
                <div class="flex items-center justify-center gap-2 text-sm text-zinc-500 mb-4">
                    <i data-lucide="map-pin" class="w-4 h-4 text-zinc-400"></i>
                    <span class="font-medium">Rua das Flores, 123 • <span class="underline font-black text-zinc-900 cursor-pointer">Info</span></span>
                </div>
                <div class="inline-flex items-center gap-2 px-5 py-2 bg-zinc-100 rounded-full text-[11px] font-black text-zinc-800 uppercase tracking-widest">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    <span>Aberto agora • 18:00 - 23:30</span>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="px-6 mb-6">
                <div class="relative">
                    <input 
                        type="text" 
                        placeholder="O que você quer comer hoje?" 
                        x-model="searchQuery"
                        class="w-full p-4 bg-zinc-100 border-none rounded-2xl text-sm outline-none focus:ring-2 ring-black pl-12"
                    >
                    <i data-lucide="search" class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 w-5 h-5"></i>
                </div>
            </div>

            <!-- Categories Nav -->
            <div class="flex gap-3 overflow-x-auto px-6 py-3 scrollbar-hide sticky top-0 bg-white/90 backdrop-blur-xl z-40 border-b border-zinc-100">
                <template x-for="cat in categories" :key="cat.id">
                    <button 
                        @click="selectedCategory = cat.id"
                        :class="selectedCategory === cat.id ? 'bg-black text-white shadow-xl shadow-black/20' : 'bg-zinc-100 text-zinc-500'"
                        class="px-6 py-2.5 rounded-full whitespace-nowrap text-xs font-black transition-all"
                        x-text="cat.name"
                    ></button>
                </template>
            </div>

            <!-- Products List -->
            <div class="px-6 mt-8 space-y-10">
                <template x-for="cat in categories" :key="cat.id">
                    <div x-show="selectedCategory === cat.id || selectedCategory === 'todos'">
                        <h2 class="text-xl font-black text-zinc-900 mb-6 flex items-center gap-2">
                            <span class="w-1.5 h-6 bg-black rounded-full"></span>
                            <span x-text="cat.name"></span>
                        </h2>
                        <div class="space-y-4">
                            <template x-for="product in products.filter(p => cat.id === 'destaques' ? p.highlight : p.category === cat.id)" :key="product.id">
                                <div class="flex justify-between bg-white rounded-3xl p-4 border border-zinc-100 shadow-sm cursor-pointer hover:shadow-xl hover:-translate-y-1 transition-all active:scale-[0.98] group">
                                    <div class="flex-1 pr-4">
                                        <span x-show="product.highlight" class="inline-block bg-zinc-900 text-white text-[9px] font-black px-3 py-1 rounded-full uppercase tracking-widest mb-3" x-text="product.highlight"></span>
                                        <h3 class="text-lg font-bold mb-1.5 text-zinc-900 group-hover:text-black" x-text="product.name"></h3>
                                        <p class="text-xs text-zinc-500 mb-4 line-clamp-2 leading-relaxed" x-text="product.description"></p>
                                        <div class="flex items-center gap-2">
                                            <span class="text-base font-black text-zinc-900">R$ <span x-text="product.price.toFixed(2)"></span></span>
                                            <span x-show="product.originalPrice" class="text-xs text-zinc-400 line-through">R$ <span x-text="product.originalPrice?.toFixed(2)"></span></span>
                                        </div>
                                    </div>
                                    <div class="relative">
                                        <img :src="product.image" class="w-28 h-28 rounded-[1.5rem] object-cover shadow-md" :alt="product.name">
                                        <div class="absolute -bottom-2 -right-2 w-8 h-8 bg-black text-white rounded-full flex items-center justify-center shadow-lg" @click.stop="cartCount++">
                                            <i data-lucide="plus" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>

            <!-- Bottom Nav -->
            <nav class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[480px] bg-white/90 backdrop-blur-xl border-t border-zinc-100 flex justify-around py-4 z-50">
                <button class="flex flex-col items-center gap-1 text-[10px] font-black uppercase tracking-widest text-black">
                    <i data-lucide="home" class="w-5 h-5"></i>
                    <span>Início</span>
                </button>
                <button class="flex flex-col items-center gap-1 text-[10px] font-black uppercase tracking-widest text-zinc-400">
                    <i data-lucide="tag" class="w-5 h-5"></i>
                    <span>Promoções</span>
                </button>
                <button @click="isCartOpen = true" class="flex flex-col items-center gap-1 text-[10px] font-black uppercase tracking-widest text-zinc-400 relative">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i>
                    <span>Sacola</span>
                    <template x-if="cartCount > 0">
                        <span class="absolute -top-1 right-1 w-5 h-5 bg-black text-white text-[10px] flex items-center justify-center rounded-full border-2 border-white font-black" x-text="cartCount"></span>
                    </template>
                </button>
                <button class="flex flex-col items-center gap-1 text-[10px] font-black uppercase tracking-widest text-zinc-400">
                    <i data-lucide="user" class="w-5 h-5"></i>
                    <span>Perfil</span>
                </button>
            </nav>

            <!-- WhatsApp Floating Button -->
            <a href="#" class="fixed bottom-24 right-6 w-14 h-14 bg-[#25d366] text-white rounded-full flex items-center justify-center shadow-2xl z-[60] hover:scale-110 transition-transform">
                <i data-lucide="phone" class="w-6 h-6"></i>
            </a>

        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
